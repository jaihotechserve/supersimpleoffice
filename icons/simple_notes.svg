  <!-- Application Geometric Glyph -->
  <rect x="68" y="84" width="120" height="126" rx="10" fill="#FFFFFF" stroke="#191918" stroke-width="5"/>
            <line x1="88" y1="114" x2="168" y2="114" stroke="#1B56C6" stroke-width="6" stroke-linecap="round"/>
            <line x1="88" y1="140" x2="168" y2="140" stroke="#191918" stroke-width="5" stroke-linecap="round"/>
            <line x1="88" y1="164" x2="152" y2="164" stroke="#52514C" stroke-width="5" stroke-linecap="round"/>
            <line x1="88" y1="188" x2="132" y2="188" stroke="#52514C" stroke-width="5" stroke-linecap="round"/>
</svg>
