            <line x1="92" y1="182" x2="152" y2="182" stroke="#C3C0B4" stroke-width="5" stroke-linecap="round"/>
            <rect x="56" y="138" width="144" height="18" rx="9" fill="#DCE7FC"/>
            <line x1="54" y1="147" x2="202" y2="147" stroke="#1B56C6" stroke-width="6" stroke-linecap="round"/>
</svg>
