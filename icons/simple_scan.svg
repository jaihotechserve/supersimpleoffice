<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Outer Archival Paper Squircle Tile -->
  <rect x="14" y="14" width="228" height="228" rx="46" fill="#F6F5F0" stroke="#C3C0B4" stroke-width="6"/>
  <rect x="20" y="20" width="216" height="216" rx="41" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Top-Left Swiss Monogram Badge -->
  <rect x="36" y="34" width="70" height="32" rx="8" fill="#191918"/>
  <text x="71.0" y="55" text-anchor="middle" fill="#F6F5F0"
        font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">JSSc</text>

  <!-- Top-Right Prussian Sapphire Precision Indicator -->
